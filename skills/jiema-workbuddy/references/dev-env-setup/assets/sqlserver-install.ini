; SQL Server（Windows）无人值守安装配置模板
; 用法：setup.exe /ConfigurationFile="<本文件路径>" /IACCEPTSQLSERVERLICENSETERMS /Q
;
; 约束：
;   1. SAPWD 由用户提供，必须 ≥8 位且含大写/小写/数字/符号中三类；
;      安装器会直接拒绝常见弱口令，技能不提供默认值。
;   2. 服务账号与启动类型按用户环境决定；技能不擅自改动已有实例。
;   3. macOS 无原生 SQL Server，本文件只在 Windows 使用。
[OPTIONS]
ACTION="Install"
FEATURES=SQLENGINE
INSTANCENAME="MSSQLSERVER"
SQLSVCACCOUNT="NT AUTHORITY\NETWORKSERVICE"
SQLSVCSTARTUPTYPE="Manual"
SQLSYSADMINACCOUNTS="BUILTIN\ADMINISTRATORS"
SECURITYMODE="SQL"
SAPWD="__SA_PASSWORD_FROM_USER__"
TCPENABLED="1"
NPENABLED="0"
IACCEPTSQLSERVERLICENSETERMS="True"
UPDATEENABLED="False"
QUIET="True"
SUPPRESSPRIVACYSTATEMENTNOTICE="True"
