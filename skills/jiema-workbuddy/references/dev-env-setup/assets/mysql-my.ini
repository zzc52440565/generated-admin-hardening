# 本机开发 MySQL 配置模板
# 由环境阶段按实际路径渲染：__BASEDIR__ / __DATADIR__ / __PORT__ / __LOGDIR__
#
# 安全约束（不可改）：
#   1. 必须同时绑定回环：bind-address / mysqlx-bind-address = 127.0.0.1；
#   2. 本模板只用于「本轮新建」的本机开发实例，不得用于已有实例或远程/生产；
#   3. 口令不进本文件；初始化后由脚本经 stdin 或 0600 选项文件设置。
[mysqld]
basedir=__BASEDIR__
datadir=__DATADIR__
port=__PORT__
bind-address=127.0.0.1
mysqlx-bind-address=127.0.0.1
character-set-server=utf8mb4
collation-server=utf8mb4_0900_ai_ci
default-authentication-plugin=caching_sha2_password
max_connections=200
log-error=__LOGDIR__/mysql-error.log
slow_query_log=1
slow_query_log_file=__LOGDIR__/mysql-slow.log
long_query_time=2
# Windows 上必须显式指定；初始化后不可改
lower_case_table_names=1

[client]
port=__PORT__
default-character-set=utf8mb4
